<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书库 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="seal">译</span>
      <span><span class="name">译伴 BilingualPress</span><span class="sub">双语阅读伴侣</span></span>
    </a>
    <nav class="nav">
      <a href="dashboard.html">工作台</a>
      <a href="new-task.html">创建任务</a>
      <a href="library.html" class="active">我的书库</a>
    </nav>
    <span class="spacer"></span>
    <div class="user-chip"><span class="av" id="u-av">林</span><span><span class="u-name" id="u-name">林一舟</span><br><span class="u-mail" id="u-mail">yizhou@example.com</span></span></div>
    <button class="menu-btn" id="menu-btn" aria-label="菜单"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobile-nav">
  <a href="dashboard.html">工作台</a>
  <a href="new-task.html">创建任务</a>
  <a href="library.html" class="active">我的书库</a>
</div>
<div id="nav-mask"></div>

<main class="page-main">
  <div class="wrap">

    <div class="sim-bar" style="margin-bottom:22px">
      <span>◆ 书库记录<b>归属到当前登录用户</b>（模拟）；换设备/换账号不可见。重新下载、阅读均为原型模拟。</span>
    </div>

    <div class="page-head">
      <div><h1>我的书库</h1><div class="sub">你处理过的书籍，可重新下载、再次阅读（字段：书名 / 语言对 / 生成时间 / 状态）。</div></div>
      <span class="spacer"></span>
      <a class="btn btn-gold" href="new-task.html">＋ 创建任务</a>
    </div>

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>书名</th><th>语言对</th><th>生成时间</th><th>状态</th><th style="text-align:right">操作</th></tr></thead>
        <tbody id="lib-body"></tbody>
      </table>
    </div>

    <div class="card" id="lib-empty" style="display:none;margin-top:20px">
      <div class="empty"><div class="glyph">📚</div><h3>书库还是空的</h3><p>完成的书籍会出现在这里，可随时重新下载或再次阅读。</p><a class="btn btn-jade" href="new-task.html">＋ 创建第一本书</a></div>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script>
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fakeDl(k){ alert('示例：重新下载双语电子书.'+k+'（原型不产生真实文件；内容与首次生成一致，兜底下载链接失效 E7）'); }

  function render() {
    if (!V2.requireUser()) return;
    var u = V2.read(V2.K.user, {});
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-mail').textContent = u.mail;
    document.getElementById('u-av').textContent = (u.name||'').charAt(0);

    var lib = V2.read(V2.K.library, []);
    var body = document.getElementById('lib-body');
    var empty = document.getElementById('lib-empty');
    if (lib.length === 0) { body.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    body.innerHTML = lib.map(function(b){
      return '<tr>' +
        '<td><b style="color:var(--ink)">'+esc(b.name)+'</b></td>' +
        '<td>'+esc(b.src)+' → '+esc(b.tgt)+'</td>' +
        '<td><span class="muted" style="color:var(--faint);font-size:13px">'+esc(b.time)+'</span></td>' +
        '<td><span class="badge b-ok"><span class="dot" style="background:var(--jade-2)"></span>已完成</span></td>' +
        '<td style="text-align:right;white-space:nowrap">' +
          '<a class="link" href="reader.html?id='+b.id+'" style="margin-right:14px">阅读</a>' +
          '<a class="link" href="javascript:void(0)" onclick="fakeDl(\'epub\')" style="margin-right:14px">EPUB</a>' +
          '<a class="link gold" href="javascript:void(0)" onclick="fakeDl(\'pdf\')">PDF</a>' +
        '</td></tr>';
    }).join('');
  }
  render();
</script>
</body>
</html>
