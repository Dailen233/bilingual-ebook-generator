<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="seal">译</span>
      <span><span class="name">译伴 BilingualPress</span><span class="sub">双语阅读伴侣</span></span>
    </a>
    <nav class="nav">
      <a href="dashboard.html" class="active">工作台</a>
      <a href="new-task.html">创建任务</a>
      <a href="library.html">我的书库</a>
    </nav>
    <span class="spacer"></span>
    <div class="user-chip">
      <span class="av" id="u-av">林</span>
      <span><span class="u-name" id="u-name">林一舟</span><br><span class="u-mail" id="u-mail">yizhou@example.com</span></span>
    </div>
    <a class="btn btn-ghost btn-sm" href="index.html" id="logout" style="display:none">退出</a>
    <button class="menu-btn" id="menu-btn" aria-label="菜单"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobile-nav">
  <a href="dashboard.html" class="active">工作台</a>
  <a href="new-task.html">创建任务</a>
  <a href="library.html">我的书库</a>
  <div class="mn-foot"><a href="#" onclick="logout()" style="font-size:13px;color:var(--faint)">退出登录（模拟）</a></div>
</div>
<div id="nav-mask"></div>

<main class="page-main">
  <div class="wrap">

    <div class="sim-bar" style="margin-bottom:22px">
      <span>◆ 本原型为<b>高保真模拟</b>：登录、任务、书库、生成结果均为本地示例数据，不接真实后端。</span>
    </div>

    <div class="page-head">
      <div>
        <h1 id="greet">你好，林一舟</h1>
        <div class="sub">今天想读哪一本？</div>
      </div>
      <span class="spacer"></span>
      <a class="btn btn-gold" href="new-task.html">＋ 创建生成任务</a>
    </div>

    <!-- 统计 -->
    <div class="grid grid-4" style="margin-bottom:28px">
      <div class="card stat jade"><div class="k">进行中任务</div><div class="v" id="st-running">0</div></div>
      <div class="card stat"><div class="k">我的书籍</div><div class="v" id="st-books">0</div></div>
      <div class="card stat gold"><div class="k">已完成</div><div class="v" id="st-done">0</div></div>
      <div class="card stat"><div class="k">累计语言对</div><div class="v" id="st-langs">0 <small>种</small></div></div>
    </div>

    <div class="grid grid-2">
      <!-- 进行中任务 -->
      <div class="card">
        <div class="meta-row" style="margin-bottom:16px">
          <h2 style="margin:0;font-size:1.2rem">进行中的任务</h2>
          <span class="spacer" style="flex:1"></span>
          <a class="link" href="new-task.html">新建</a>
        </div>
        <div id="running-list" class="stack"></div>
      </div>

      <!-- 最近书籍 -->
      <div class="card">
        <div class="meta-row" style="margin-bottom:16px">
          <h2 style="margin:0;font-size:1.2rem">最近的书</h2>
          <span class="spacer" style="flex:1"></span>
          <a class="link" href="library.html">全部书库 →</a>
        </div>
        <div id="recent-list" class="stack"></div>
      </div>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script>
  function logout(){ V2.clearAuth(); location.href='index.html'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render() {
    if (!V2.requireUser()) return;
    var u = V2.read(V2.K.user, {});
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-mail').textContent = u.mail;
    document.getElementById('u-av').textContent = (u.name||'').charAt(0);
    document.getElementById('greet').textContent = '你好，' + u.name;
    document.getElementById('logout').style.display = 'inline-flex';
    document.title = '工作台 · 译伴';

    var lib = V2.read(V2.K.library, []);
    var t = V2.getTask();
    var running = (t && t.state === 'running') ? [t] : [];

    // 统计
    var doneBooks = lib.filter(function(b){return b.status==='done';});
    var langs = {};
    lib.forEach(function(b){ langs[b.src+'→'+b.tgt] = 1; });
    running.forEach(function(b){ langs[b.src+'→'+b.tgt] = 1; });
    document.getElementById('st-running').textContent = running.length;
    document.getElementById('st-books').textContent = lib.length;
    document.getElementById('st-done').textContent = doneBooks.length;
    document.getElementById('st-langs').innerHTML = Object.keys(langs).length + ' <small>种</small>';

    // 进行中任务
    var rl = document.getElementById('running-list');
    if (running.length === 0) {
      rl.innerHTML = '<div class="empty"><div class="glyph">📭</div><h3>暂无进行中的任务</h3><p>上传一本书，开始你的第一个双语生成任务。</p><a class="btn btn-jade btn-sm" href="new-task.html">＋ 创建任务</a></div>';
    } else {
      rl.innerHTML = running.map(function(x){
        var pct = Math.min(100, Math.round(x.cur / x.total * 100));
        return '<div class="tile">' +
          '<div class="thumb">'+esc(x.name.charAt(0))+'</div>' +
          '<div class="info"><div class="t">'+esc(x.name)+'</div>' +
          '<div class="s">'+esc(x.src)+' → '+esc(x.tgt)+' · '+x.cur+'/'+x.total+' 段（示例进度单位）</div>' +
          '<div class="bar gold" style="margin-top:8px"><i style="width:'+pct+'%"></i></div></div>' +
          '<div class="act"><a class="btn btn-ghost btn-sm" href="task-detail.html">查看</a></div></div>';
      }).join('');
    }

    // 最近书籍
    var rec = document.getElementById('recent-list');
    if (lib.length === 0) {
      rec.innerHTML = '<div class="empty"><div class="glyph">📚</div><h3>书库还是空的</h3><p>完成的书籍会出现在这里，可重新下载。</p></div>';
    } else {
      rec.innerHTML = lib.slice(0,3).map(function(b){
        return '<div class="tile">' +
          '<div class="thumb">'+esc(b.name.charAt(0))+'</div>' +
          '<div class="info"><div class="t">'+esc(b.name)+'</div>' +
          '<div class="s">'+esc(b.src)+' → '+esc(b.tgt)+' · '+esc(b.time)+'</div></div>' +
          '<div class="act"><a class="btn btn-ghost btn-sm" href="reader.html?id='+b.id+'">阅读</a></div></div>';
      }).join('');
    }
  }
  render();
</script>
</body>
</html>
