<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="dashboard.css">
<meta name="theme-color" content="#1e3a4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="译伴 首页">
      <span class="seal-mark">译伴</span>
    </a>
    <nav class="nav">
      <a href="dashboard.html">工作台</a>
      <a href="new-task.html">创建任务</a>
      <a href="library.html">我的书库</a>    </nav>
    <span class="spacer"></span>
    <div class="acct" hidden>
      <button class="acct-btn" id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="av" id="u-av">样</span>
        <span class="acct-meta">
          <span class="u-name" id="u-name">示例用户</span>
          <span class="u-mail" id="u-mail">yizhou@example.com</span>
        </span>
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="acct-menu" id="acct-menu" role="menu" hidden>
        <p class="acct-head">当前模拟账号</p>
        <p class="acct-mail" id="acct-mail">yizhou@example.com</p>
        <button class="acct-item" type="button" role="menuitem" onclick="logout()">退出登录（模拟）</button>
      </div>
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="菜单" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobile-nav">
  <a href="dashboard.html">工作台</a>
  <a href="new-task.html">创建任务</a>
  <a href="library.html">我的书库</a>
  <div class="mn-foot"><a href="#" onclick="logout();return false;">退出登录（模拟）</a></div>
</div>
<div id="nav-mask"></div>

<main class="page-main db">
  <div class="wrap">

    <div class="sim-bar" style="margin-bottom:26px">
      <span>◆ 本原型为<b>高保真模拟</b>：登录、任务、书库、生成结果均为本地示例数据，不接真实后端。</span>
    </div>

    <div class="db-head">
      <div>
        <h1 id="greet">你好，林一舟</h1>
        <p class="db-sub">继续读点什么，或开始一本新书。</p>
      </div>
      <a class="btn btn-gold" href="new-task.html">＋ 创建生成任务</a>
    </div>

    <section class="db-hero" id="db-hero" aria-label="继续阅读"></section>

    <section class="db-running" id="db-running" aria-label="进行中的任务"></section>

    <section class="db-running" id="db-failed" aria-label="失败的任务"></section>

    <section class="db-recent">
      <div class="db-sec-head">
        <h2>最近的书</h2>
        <span class="db-stats" id="db-stats"></span>
        <a class="link" href="library.html">全部书库 →</a>
      </div>
      <div class="db-recent-list" id="db-recent"></div>
    </section>

  </div>
</main>

<script src="app.js"></script>
<script src="topbar.js"></script>
<script>
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function coverHtml(b, i) {
    var parts = (b.name || '').split(' · ');
    var zh = (parts[parts.length - 1] || b.name || '').trim();
    var en = parts.length > 1 ? parts.slice(0, -1).join(' · ').trim() : '';
    return '<div class="db-cover v' + (i % 3) + '">'
      + '<span class="c-brand">译伴 · 双语</span>'
      + (en ? '<span class="c-en">' + esc(en) + '</span>' : '')
      + '<span class="c-zh">' + esc(zh) + '</span>'
      + '<span class="c-pair">' + esc(b.src) + ' → ' + esc(b.tgt) + '</span>'
      + '</div>';
  }

  function render() {
    if (!V2.requireUser()) return;
    var u = V2.read(V2.K.user, {});
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-mail').textContent = u.mail;
    document.getElementById('u-av').textContent = (u.name||'').charAt(0);
    document.getElementById('greet').textContent = '你好，' + u.name;
    document.title = '工作台 · 译伴';

    V2.advanceTasks(Date.now()); // 保持工作台与详情/书库状态一致
    var lib = V2.read(V2.K.library, []);
    var running = V2.getRunningTasks();
    var doneBooks = lib.filter(function(b){ return b.status === 'done'; });

    // 精简统计（辅助决策）
    document.getElementById('db-stats').textContent =
      '共 ' + lib.length + ' 本 · 已完成 ' + doneBooks.length + ' · 进行中 ' + running.length;

    // 继续阅读（视觉主角）：最近一本书
    var hero = document.getElementById('db-hero');
    if (lib.length) {
      var book = lib[0];
      hero.innerHTML =
        '<div class="db-continue">'
        + '<div class="db-continue-cover">' + coverHtml(book, 0) + '</div>'
        + '<div class="db-continue-body">'
        +   '<span class="db-kicker">开始阅读</span>'
        +   '<h2 class="db-continue-title">' + esc(book.name) + '</h2>'
        +   '<p class="db-continue-meta">' + esc(book.src) + ' → ' + esc(book.tgt) + ' · ' + esc(book.time) + '</p>'
        +   '<a class="btn btn-primary" href="reader.html?id=' + encodeURIComponent(book.id) + '">开始阅读 →</a>'
        + '</div></div>';
    } else {
      hero.innerHTML =
        '<div class="db-continue db-empty">'
        + '<div class="db-empty-mark" aria-hidden="true">译</div>'
        + '<div class="db-continue-body">'
        +   '<span class="db-kicker">欢迎使用</span>'
        +   '<h2 class="db-continue-title">书库还是空的</h2>'
        +   '<p class="db-continue-meta">上传一本书，AI 逐段翻译成原文与译文对照的双语电子书，导出 EPUB / PDF。</p>'
        +   '<a class="btn btn-primary" href="new-task.html">＋ 创建第一本书</a>'
        + '</div></div>';
    }

    // 进行中的任务
    var run = document.getElementById('db-running');
    if (running.length) {
      run.innerHTML = running.map(function (x) {
        var pct = Math.min(100, Math.round(x.cur / x.total * 100));
        return '<div class="db-run-card">'
          + '<div class="db-run-info">'
          +   '<span class="db-kicker">处理中</span>'
          +   '<div class="db-run-title">' + esc(x.name) + '</div>'
          +   '<div class="db-run-meta">' + esc(x.src) + ' → ' + esc(x.tgt) + ' · ' + x.cur + '/' + x.total + ' 段</div>'
          +   '<div class="bar gold"><i style="width:' + pct + '%"></i></div>'
          + '</div>'
          + '<a class="btn btn-ghost btn-sm" href="task-detail.html?id=' + encodeURIComponent(x.id) + '">查看详情</a>'
          + '</div>';
      }).join('');
    } else {
      run.innerHTML =
        '<div class="db-run-empty"><span>暂无进行中的任务</span><a class="link" href="new-task.html">新建任务 →</a></div>';
    }

    // 失败的任务（可回到详情重试）
    var failed = document.getElementById('db-failed');
    var failedTasks = V2.getFailedTasks();
    if (failedTasks.length) {
      failed.innerHTML =
        '<div class="db-sec-head"><h2>失败的任务</h2></div>'
        + failedTasks.map(function (x) {
            return '<div class="db-run-card">'
              + '<div class="db-run-info">'
              +   '<span class="db-kicker" style="color:var(--err,#b3261e)">失败 · 可重试</span>'
              +   '<div class="db-run-title">' + esc(x.name) + '</div>'
              +   '<div class="db-run-meta">' + esc(x.src) + ' → ' + esc(x.tgt) + '</div>'
              + '</div>'
              + '<a class="btn btn-ghost btn-sm" href="task-detail.html?id=' + encodeURIComponent(x.id) + '">查看详情</a>'
              + '</div>';
          }).join('');
    } else {
      failed.innerHTML = '';
    }

    // 最近的书（不含已在继续阅读中的那本）
    var rec = document.getElementById('db-recent');
    var rest = lib.slice(1, 4);
    if (rest.length === 0) {
      rec.innerHTML = lib.length
        ? '<div class="db-recent-empty">没有更多书籍。<a class="link" href="new-task.html">创建一本新书 →</a></div>'
        : '<div class="db-recent-empty">完成的书籍会出现在这里，可随时重新下载或再次阅读。</div>';
    } else {
      rec.innerHTML = rest.map(function (b, i) {
        return '<div class="db-book">'
          + '<div class="db-book-cover v' + ((i + 1) % 3) + '">' + esc((b.name || '').charAt(0)) + '</div>'
          + '<div class="db-book-info">'
          +   '<div class="db-book-title">' + esc(b.name) + '</div>'
          +   '<div class="db-book-meta">' + esc(b.src) + ' → ' + esc(b.tgt) + ' · ' + esc(b.time) + '</div>'
          + '</div>'
          + '<a class="btn btn-ghost btn-sm" href="reader.html?id=' + encodeURIComponent(b.id) + '">阅读</a>'
          + '</div>';
      }).join('');
    }
  }
  render();
</script>
</body>
</html>
