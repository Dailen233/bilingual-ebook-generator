<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="login.css">
<meta name="theme-color" content="#1e3a4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="译伴 首页">
      <span class="seal-mark">译伴</span>
    </a>
    <span class="spacer"></span>
    <div class="guest-actions">
      <a class="btn btn-ghost btn-sm" href="index.html">← 返回首页</a>
      <a class="btn btn-primary btn-sm" href="register.html">注册新账号</a>
    </div>
    <div class="acct" hidden>
      <button class="acct-btn" id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="av" id="u-av">样</span>
        <span class="acct-meta">
          <span class="u-name" id="u-name">示例用户</span>
          <span class="u-mail" id="u-mail">yizhou@example.com</span>
        </span>
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="acct-menu" id="acct-menu" role="menu" hidden>
        <p class="acct-head">当前模拟账号</p>
        <p class="acct-mail" id="acct-mail">yizhou@example.com</p>
        <button class="acct-item" type="button" role="menuitem" onclick="logout()">退出登录（模拟）</button>
      </div>
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="菜单" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobile-nav">
  <a href="index.html">首页</a>
  <a href="login.html">登录</a>
  <a href="register.html">注册</a>
</div>
<div id="nav-mask"></div>

<main>
  <div class="auth">
    <!-- 左侧品牌艺术区 -->
    <div class="art">
      <span class="kicker">双语阅读伴侣</span>
      <h2>让每一页，<br>都有另一门语言陪伴。</h2>
      <div class="bind-art" aria-hidden="true">
        <span class="paper"></span>
        <span class="frame"></span>
        <span class="seal"><i class="s1"></i><i class="s2"></i><i class="s3"></i></span>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="form-side">
      <div class="form-card">
        <h1>登录</h1>
        <p style="color:var(--muted);font-size:14px;margin-bottom:22px">欢迎回来，继续你的双语阅读。</p>

        <div class="sim-bar" style="margin-bottom:20px">
          <span>⚠ 本原型登录为<b>模拟</b>：不校验真实密码、不接后端，登录态仅存于本地浏览器。</span>
        </div>

        <form id="login-form" onsubmit="return doLogin(event)">
          <div class="field">
            <label for="mail">邮箱</label>
            <input class="input" id="mail" type="email" value="yizhou@example.com" autocomplete="username">
            <div class="hint-line">已填入示例账号，可直接登录体验</div>
          </div>
          <div class="field">
            <label for="pwd">密码</label>
            <input class="input" id="pwd" type="password" value="••••••••" autocomplete="current-password">
          </div>
          <div id="login-err" class="alert alert-err" style="display:none;margin-bottom:14px"></div>
          <button class="btn btn-primary btn-block" type="submit">登录</button>
        </form>

        <div class="divider">或</div>
        <button class="btn btn-ghost btn-block" type="button" onclick="demoLogin()">以示例账号登录（模拟）</button>

        <p style="text-align:center;margin-top:20px;font-size:12.5px;color:var(--faint)">
          管理员请使用<a class="link gold" href="../v3/admin-login.html">独立管理入口</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script src="topbar.js"></script>
<script>
  function afterLogin() {
    V2.setUser();
    location.href = 'dashboard.html';
  }
  function loginErr(msg) {
    var box = document.getElementById('login-err');
    box.innerHTML = '<span class="ic">✕</span><span>'+msg+'</span>';
    box.style.display = 'flex';
  }
  function doLogin(e) {
    e.preventDefault();
    var mail = document.getElementById('mail').value.trim();
    var pwd = document.getElementById('pwd').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { loginErr('请输入有效的邮箱地址。'); return false; }
    if (!pwd) { loginErr('请输入密码。'); return false; }
    afterLogin();
    return false;
  }
  function demoLogin() {
    document.getElementById('mail').value = V2.DEMO_USER.mail;
    document.getElementById('pwd').value = '••••••••';
    afterLogin();
  }
</script>
</body>
</html>
