<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="topbar.css">
<meta name="theme-color" content="#1e3a4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="译伴 首页">
      <span class="seal-mark">译</span>
      <span class="mark-cn">译伴</span>
    </a>
    <span class="spacer"></span>
    <div class="guest-actions">
      <a class="btn btn-ghost btn-sm" href="index.html">← 返回首页</a>
      <a class="btn btn-primary btn-sm" href="login.html">已有账号，登录</a>
    </div>
    <div class="acct" hidden>
      <button class="acct-btn" id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="av" id="u-av">样</span>
        <span class="acct-meta">
          <span class="u-name" id="u-name">示例用户</span>
          <span class="u-mail" id="u-mail">yizhou@example.com</span>
        </span>
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="acct-menu" id="acct-menu" role="menu" hidden>
        <p class="acct-head">当前模拟账号</p>
        <p class="acct-mail" id="acct-mail">yizhou@example.com</p>
        <button class="acct-item" type="button" role="menuitem" onclick="logout()">退出登录（模拟）</button>
      </div>
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="菜单" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>
<div id="mobile-nav">
  <a href="index.html">首页</a>
  <a href="login.html">登录</a>
  <a href="register.html">注册</a>
</div>
<div id="nav-mask"></div>

<main>
  <div class="auth">
    <div class="art">
      <div class="seal">译</div>
      <h2>创建账号，<br>把读过的书都留住。</h2>
      <p>账号用于记录你的书籍、任务、下载与阅读位置（后续里程碑）。注册字段与验证策略在原型中为示例，设计阶段再定（P12 待确认）。</p>
      <div class="quote">"再次找到它，是双语阅读伴侣的最后一环。"</div>
    </div>

    <div class="form-side">
      <div class="form-card">
        <a class="back" href="index.html">← 返回首页</a>
        <h1 style="font-size:1.7rem;margin-bottom:4px">注册</h1>
        <p style="color:var(--muted);font-size:14px;margin-bottom:22px">几步即可开始处理你的第一本书。</p>

        <div class="sim-bar" style="margin-bottom:20px">
          <span>⚠ 本原型注册为<b>模拟</b>：不真实创建账号、不发验证、不接后端。</span>
        </div>

        <form id="reg-form" onsubmit="return doRegister(event)">
          <div class="field">
            <label for="nm">昵称</label>
            <input class="input" id="nm" type="text" value="林一舟" autocomplete="name">
          </div>
          <div class="field">
            <label for="rmail">邮箱</label>
            <input class="input" id="rmail" type="email" value="yizhou@example.com" autocomplete="email">
            <div class="hint-line">原型示例：邮箱密码形式；是否需邮箱/手机验证属 P12 待确认</div>
          </div>
          <div class="field">
            <label for="rpwd">密码</label>
            <input class="input" id="rpwd" type="password" value="••••••••" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="rpwd2">确认密码</label>
            <input class="input" id="rpwd2" type="password" value="••••••••" autocomplete="new-password">
          </div>
          <div id="reg-err" class="alert alert-err" style="display:none;margin-bottom:14px"></div>
          <button class="btn btn-jade btn-block" type="submit">注册并进入工作台</button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted)">
          已有账号？<a class="link" href="login.html">直接登录</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script src="topbar.js"></script>
<script>
  function regErr(msg) {
    var box = document.getElementById('reg-err');
    box.innerHTML = '<span class="ic">✕</span><span>'+msg+'</span>';
    box.style.display = 'flex';
  }
  function doRegister(e) {
    e.preventDefault();
    var nm = document.getElementById('nm').value.trim();
    var mail = document.getElementById('rmail').value.trim();
    var p1 = document.getElementById('rpwd').value;
    var p2 = document.getElementById('rpwd2').value;
    if (!nm) { regErr('请填写昵称。'); return false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { regErr('邮箱格式不正确。'); return false; }
    if (p1.length < 8) { regErr('密码至少 8 位（原型示例校验，真实策略 P12 待确认）。'); return false; }
    if (p1 !== p2) { regErr('两次输入的密码不一致。'); return false; }
    V2.setUser();
    location.href = 'dashboard.html';
    return false;
  }
</script>
</body>
</html>
