<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理端登录 · 译伴 BilingualPress</title>
<link rel="stylesheet" href="styles.css">
<meta name="theme-color" content="#1e3a4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<header class="topbar admin-topbar">
  <div class="wrap">
    <a class="admin-brand" href="admin.html">
      <span class="seal">管</span>
      <b>译伴 · 管理后台</b>
      <span class="tag">独立入口</span>
    </a>
    <span class="spacer"></span>
    <a class="btn btn-ghost btn-sm" href="index.html" style="background:transparent;color:#a9bccb;border-color:#2c465e">← 返回用户端</a>
  </div>
</header>

<main>
  <div class="auth" style="grid-template-columns:1fr;max-width:520px;margin:40px auto">
    <div class="form-side" style="padding:0 20px">
      <div class="form-card" style="max-width:none">
        <div class="admin-brand" style="color:var(--ink);margin-bottom:18px">
          <span class="seal" style="background:var(--ink);color:var(--gold-2);border-color:var(--ink)">管</span>
          <b>管理员登录</b>
          <span class="tag" style="color:var(--muted);border-color:var(--line)">独立入口 · 服务端校验角色</span>
        </div>
        <h1 style="font-size:1.6rem;margin-bottom:4px">登录管理后台</h1>
        <p style="color:var(--muted);font-size:14px;margin-bottom:20px">管理员使用独立角色与独立入口；实际权限由服务端校验，不能只靠隐藏前端菜单（G11）。</p>

        <div class="sim-bar" style="margin-bottom:20px">
          <span>⚠ 本原型管理登录为<b>模拟</b>：不校验真实凭据、不接后端；权限仅为演示效果，非真实安全能力。</span>
        </div>

        <form onsubmit="return doAdminLogin(event)">
          <div class="field">
            <label for="amail">管理员账号</label>
            <input class="input" id="amail" type="text" value="admin@example.com">
            <div class="hint-line">示例管理员（登录失败/会话过期策略设计阶段定，E-AD4）</div>
          </div>
          <div class="field">
            <label for="apwd">密码</label>
            <input class="input" id="apwd" type="password" value="••••••••">
          </div>
          <div id="alogin-err" class="alert alert-err" style="display:none;margin-bottom:14px"></div>
          <button class="btn btn-primary btn-block" type="submit">登录后台（模拟）</button>
        </form>
        <p style="text-align:center;margin-top:18px;font-size:12.5px;color:var(--faint)">
          普通用户请前往<a class="link" href="login.html">用户端登录</a>（直接访问管理端路由将被服务端拒绝，E-AD5）
        </p>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
  function doAdminLogin(e){
    e.preventDefault();
    var mail = document.getElementById('amail').value.trim();
    var pwd = document.getElementById('apwd').value;
    var box = document.getElementById('alogin-err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) || !pwd) {
      box.innerHTML = '<span class="ic">✕</span><span>请输入有效的管理员账号与密码（模拟：不校验真实凭据）。</span>';
      box.style.display = 'flex';
      return false;
    }
    V2.setAdmin(); location.href='admin.html'; return false;
  }
</script>
</body>
</html>
